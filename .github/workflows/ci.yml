name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: TartUI tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out TartUI
        uses: actions/checkout@v4

      - name: Check packaging scripts
        run: bash -n scripts/bundle.sh scripts/install.sh scripts/lib.sh scripts/release.sh

      - name: Run tests
        run: swift test

  package:
    name: Build app bundle
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out TartUI
        uses: actions/checkout@v4

      - name: Build TartUI.app
        run: ./scripts/bundle.sh debug

      - name: Verify app bundle
        run: |
          bin_path="$(swift build -c debug --product TartUI --show-bin-path)"
          app="$bin_path/TartUI.app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/Legal/TartUI-LICENSE.txt"
          test -f "$app/Contents/Resources/TartUI_TartUI.bundle/en.lproj/Localizable.strings"
          test -f "$app/Contents/Resources/TartUI_TartUI.bundle/zh-hans.lproj/Localizable.strings"
