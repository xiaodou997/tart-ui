name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: TartUI tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out TartUI
        uses: actions/checkout@v4

      - name: Check packaging scripts
        run: bash -n scripts/bundle.sh scripts/install.sh scripts/lib.sh scripts/release.sh

      - name: Run tests
        run: swift test

  package:
    name: Build app bundle
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out TartUI
        uses: actions/checkout@v4

      - name: Build TartUI.app
        run: ./scripts/bundle.sh debug

      - name: Verify app bundle
        run: |
          bin_path="$(swift build -c debug --product TartUI --arch arm64 --show-bin-path)"
          app="$bin_path/TartUI.app"
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/TartUI")" = "arm64"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "26.0"
          test -f "$app/Contents/Resources/Legal/TartUI-LICENSE.txt"
          test -f "$app/Contents/Resources/TartUI_TartUI.bundle/en.lproj/Localizable.strings"
          test -f "$app/Contents/Resources/TartUI_TartUI.bundle/zh-hans.lproj/Localizable.strings"

      - name: Smoke-test app launch
        run: |
          bin_path="$(swift build -c debug --product TartUI --arch arm64 --show-bin-path)"
          app="$bin_path/TartUI.app"
          log="$RUNNER_TEMP/tartui-launch.log"

          "$app/Contents/MacOS/TartUI" >"$log" 2>&1 &
          pid=$!
          sleep 5

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "TartUI exited during startup" >&2
            cat "$log" >&2 || true
            wait "$pid" || true
            exit 1
          fi

          kill "$pid" || true
          wait "$pid" || true

      - name: Package test build
        run: |
          bin_path="$(swift build -c debug --product TartUI --arch arm64 --show-bin-path)"
          app="$bin_path/TartUI.app"
          ditto -c -k --keepParent "$app" "TartUI-test.zip"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TartUI-test
          path: TartUI-test.zip
          if-no-files-found: error
