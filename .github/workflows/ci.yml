name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: TartUI tests
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out TartUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run tests
        run: swift test

  package:
    name: Build single-app package
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Check out TartUI and Tart
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build TartUI.app with bundled Tart
        run: ./scripts/bundle.sh debug

      - name: Verify helper and app signatures
        run: |
          app=".build/arm64-apple-macosx/debug/TartUI.app"
          helper="$app/Contents/Helpers/tart.app/Contents/MacOS/tart"
          "$helper" --version
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Helpers/tart.app/Contents/Info.plist")" = "true"
          codesign --verify --deep --strict "$app"
          test -z "$(git -C Vendor/tart status --porcelain)"
          test -f "$app/Contents/Resources/Legal/Tart-LICENSE.txt"
          test -f "$app/Contents/Resources/TartUI_TartUI.bundle/en.lproj/Localizable.strings"
          test -f "$app/Contents/Resources/TartUI_TartUI.bundle/zh-hans.lproj/Localizable.strings"
